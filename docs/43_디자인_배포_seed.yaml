goal: docs/21_UX_문구.md v0.8의 구성·흐름·문구를 바꾸지 않은 채, 위둘 정본 자산(41_앱_색상.md, 42_디자인_자산/, Figma)을 근거로 impeccable을 써서 /verify와 /welcome(Header·7섹션·Footer)의 시각 디자인을 백지에서 다시 만들고, 인터랙션·모션과 엣지 케이스 화면까지 구현한 뒤 DESIGN.md 정본·시안 비교 기록·WCAG 2.1 AA 접근성 검증 리포트를 남기고 Vercel에 mock 시연본을 배포한다. 실 API 연동 운영 배포는 백엔드 준비 뒤 환경변수 전환으로 이어간다.
task_type: code
brownfield_context:
  project_type: brownfield
  context_references:
    - path: docs/21_UX_문구.md
      role: primary
      summary: v0.8 화면 구성·섹션 순서·문구의 정본. 수정하지 않음
    - path: docs/41_앱_색상.md
      role: primary
      summary: 위둘 앱 색상 팔레트 정본
    - path: docs/42_디자인_자산/
      role: primary
      summary: 로고·배너·톤앤무드·캐릭터·이미지 정본 자산(전체 자산의 일부)
    - path: docs/12_디자인_배포_인계.md
      role: primary
      summary: 이 seed의 요구사항 요약(인터뷰 결과)
    - path: docs/30_API_계약.md
      role: reference
      summary: 실 API 전환 시 따를 계약
    - path: src/sections/registry.ts
      role: reference
      summary: 랜딩 섹션 순서·노출 설정 한 곳. 섹션별 컴포넌트와 content.ts 분리 구조
  existing_patterns:
    - 섹션은 src/sections/<id>/ 폴더에 컴포넌트와 content.ts를 두고 registry.ts 배열로 순서를 관리
    - 화면 문구는 각 섹션의 content.ts와 src/content에만 둠
    - 코드·문서 식별자에 institution 대신 org 사용
  existing_dependencies:
    - next 16.3.5 (App Router), react 19.2.8
    - tailwindcss 4 (@tailwindcss/postcss)
    - html-to-image (계정 PNG 생성)
    - pnpm
constraints:
  - docs/21_UX_문구.md v0.8의 섹션 구성·순서·흐름·문구를 바꾸지 않음. 미결인 FAQ 3번 답변, 앱 캡처 이미지, 매뉴얼 PDF 교체는 현재 상태(플레이스홀더·기존 파일)를 유지
  - 디자인 근거는 41_앱_색상.md, 42_디자인_자산/, 사용자가 Figma에서 가져온 자산만 사용. 40_디자인_토큰.yaml, 90_archive/의 DESIGN 문서, 현재 globals.css의 임시 토큰, 현재 컴포넌트 스타일은 근거로 쓰지 않음
  - 디자인 작업 도구는 impeccable(shape, critique, audit, polish, document)만 사용하고 gstack 디자인 스킬은 쓰지 않음
  - 참고 사이트는 runway와 산타 토익으로 한정하며 비교 참고로만 사용
  - 디자인·스타일 코드는 Claude가 구현까지 수행(사용자 코드 작성 원칙의 예외)
  - 개인정보(이름, 연락처, 부서 등)를 받거나 보내는 코드를 만들지 않음
  - 원래 없던 설명 주석을 코드에 새로 넣지 않음
  - Next.js 코드 작성 전 node_modules/next/dist/docs/의 해당 가이드를 확인
  - 산출 문서는 DESIGN.md, 시안 비교 기록, 접근성 검증 리포트 세 개로 한정. 실기기 확인 결과는 접근성 검증 리포트 안의 배포 확인 기록 항목에 남김
  - 작업 기한은 착수 후 1~2일. 넘길 것 같으면 사용자에게 먼저 알림
  - 운영 배포(6-2)는 백엔드가 30_API_계약.md대로 구현된 뒤에만 진행
acceptance_criteria:
  - 1단계에서 사용자와 확정한 Figma 자산 목록(초기 제안은 인계 문서 4장 1단계 항목)을 근거로 한 시각 방향 2~3안과 runway·산타 토익 비교, 사용자 선택 결과가 시안 비교 기록 문서에 남아 있다
  - 선택한 방향이 globals.css 토큰 → 공통 컴포넌트 → /verify → /welcome Header·7섹션·Footer 순으로 구현되어, 모바일(375px)과 데스크톱(1440px)에서 모든 화면이 21 v0.8의 순서·문구와 일치하게 렌더링되고 pnpm build가 오류 없이 통과한다
  - 인터랙션·모션(Hero 애니메이션 포함)이 적용되고, prefers-reduced-motion 설정 시 움직임 없는 대체 표현이 나오며, 기관코드 오류·발급 실패·PNG 다운로드 실패·네트워크 오류 4종 엣지 케이스가 각각 정해진 mock 입력(기관코드 값 또는 mock 설정)으로 재현되고 그 재현 방법이 문서에 적혀 있다
  - 접근성 검증 리포트가 impeccable critique·audit·polish 결과를 담고, 모든 화면에서 텍스트 대비 4.5:1 이상, 키보드만으로 전체 흐름 조작, 보이는 포커스 표시, 본문 18px·버튼 글자 20px·터치 영역 48px 이상을 충족한다. 미해결 위반은 0건이며, 위둘 브랜드 색 사용 때문에 생긴 위반만 리포트에 해당 위치와 사유를 적으면 예외로 인정한다
  - 구현된 코드에서 impeccable document로 추출한 DESIGN.md가 저장소 루트에 있고, 토큰 값이 globals.css와 일치한다
  - Vercel mock 미리보기 URL에서 /verify → /welcome 흐름이 동작하고, 코드 수정 없이 환경변수 변경만으로 API 모드가 mock에서 real로 바뀐다. 실기기 확인은 iOS Safari와 Android Chrome에서 계정 발급 뒤 PNG 자동 다운로드 여부를 사용자가 확인하고, 그 결과가 접근성 검증 리포트의 배포 확인 기록 항목에 남아 있다
ontology_schema:
  name: 위둘 안내 웹 디자인·배포 작업
  description: 정본 자산에서 시각 방향을 정하고 구현·검증·문서화·배포까지 이어지는 디자인 인계 작업의 산출물과 상태
  fields:
    - name: uxSpec
      type: object
      description: 21_UX_문구.md v0.8. 화면 경로(/verify, /welcome), 섹션 id 목록(hero, intro, anonymity, account, process, install, faq), 문구. 읽기 전용
    - name: sourceDocGate
      type: object
      description: 착수 전 문서 정리 상태. 11_seed.yaml·PRODUCT.md 정합, 섹션 id process 통일, 토큰 파일 archive 이동, 커밋 여부
    - name: brandAssets
      type: array
      description: 정본 자산 목록. 41_앱_색상.md, 42_디자인_자산/ 파일, 1단계에서 확정한 Figma 자산
    - name: visualDirections
      type: array
      description: impeccable shape로 만든 시각 방향 2~3안. 각 안의 이름, 요약, 참고 사이트 비교, 선택 여부
    - name: designTokens
      type: object
      description: globals.css에 정의한 색상·타이포·간격·반경 토큰. DESIGN.md와 값이 같아야 함
    - name: interactionMotion
      type: object
      description: 적용한 인터랙션·모션 목록(Hero 애니메이션 포함)과 각 항목의 prefers-reduced-motion 대체 표현
    - name: edgeCaseStates
      type: array
      description: orgCodeInvalid, issueFailed, pngDownloadFailed, networkError 4종 화면 상태와 각각의 mock 재현 입력
    - name: accessibilityReport
      type: object
      description: 점검 항목(대비, 키보드, 포커스, 글자 크기, 터치 영역, reduced-motion)별 결과, 미해결 위반 수, 브랜드 색 예외 목록(위치·사유), 배포 확인 기록(브라우저별 PNG 자동 다운로드 결과)
    - name: deliverables
      type: array
      description: DESIGN.md, 시안 비교 기록, 접근성 검증 리포트
    - name: deployStage
      type: string
      description: none | mockPreview | production. production은 백엔드 준비 뒤에만 가능
    - name: apiMode
      type: string
      description: mock | real. 환경변수로만 전환
evaluation_principles:
  - name: UX 정본 보존
    description: 21 v0.8의 구성·순서·문구가 바뀌지 않음
    weight: 1.0
  - name: 브랜드 일관성
    description: 색상·타이포·로고·캐릭터가 위둘 앱 정본 자산에서 나오고 테스트용 토큰을 쓰지 않음
    weight: 0.9
  - name: 접근성
    description: WCAG 2.1 AA와 고연령 기준(본문 18px, 버튼 20px, 터치 48px) 충족. 예외는 브랜드 색 사유로 기록된 것만 허용
    weight: 0.9
  - name: 문서·코드 일치
    description: DESIGN.md 토큰과 globals.css, 기준 문서와 코드 섹션 id가 서로 같음
    weight: 0.7
  - name: 기존 구조 유지
    description: registry.ts와 섹션별 content.ts 분리 구조, org 명명 규칙을 따름
    weight: 0.7
exit_conditions:
  - name: 착수 전 문서 정리
    description: 디자인 작업을 시작하기 전에 통과해야 하는 선행 게이트
    criteria: 11_seed.yaml·PRODUCT.md에 재발급 흐름·"흐름 7단계"·매뉴얼 두 곳 표현이 없고, PRODUCT.md "아직 없는 것" 목록에 로고가 없으며, 섹션 id가 문서와 코드(registry.ts, 폴더명) 모두 process이고, 40_디자인_토큰.yaml이 90_archive/로 옮겨져 00_README.md에서 빠진 상태로 커밋됨. PRODUCT.md를 가장 먼저 고침
  - name: Figma 자산 지연
    description: Figma 자산이 없어 시안 작업을 시작할 수 없음
    criteria: 문서 정리 게이트 통과 후 Figma 자산이 없으면 작업을 멈추고 필요한 자산 목록을 사용자에게 요청
  - name: mock 시연 완료
    description: 디자인 구현·검증·문서화가 끝나고 mock 미리보기 URL이 동작
    criteria: acceptance_criteria 6개 모두 충족
  - name: 운영 배포 대기
    description: 백엔드가 30_API_계약.md대로 구현되기 전에는 운영 배포를 진행하지 않음
    criteria: 백엔드 준비 확인 전까지 deployStage는 mockPreview에서 멈춤
